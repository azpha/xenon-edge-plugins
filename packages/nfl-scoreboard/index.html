<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>tr('NFL Scoreboard')</title>
  <link rel="icon" type="image/svg+xml" href="resources/icon.svg" />
  <meta name="x-icue-widget-preview" content="resources/preview.png" />

  <meta name="x-icue-property" content="refreshLive" data-label="tr('Live Refresh')" data-type="slider" data-default="30" data-min="15" data-max="120" data-step="5" data-unit-label="'s'" />
  <meta name="x-icue-property" content="refreshIdle" data-label="tr('Idle Refresh')" data-type="slider" data-default="10" data-min="1" data-max="30" data-step="1" data-unit-label="'min'" />
  <meta name="x-icue-property" content="showFinished" data-label="tr('Show Finished Games')" data-type="switch" data-default="true" />
  <meta name="x-icue-property" content="showLogos" data-label="tr('Show Team Logos')" data-type="switch" data-default="true" />
  <meta name="x-icue-property" content="teamColors" data-label="tr('Team Color Accents')" data-type="switch" data-default="true" />

  <meta name="x-icue-property" content="textColor" data-label="tr('Text Color')" data-type="color" data-default="'#ffffff'" />
  <meta name="x-icue-property" content="accentColor" data-label="tr('Accent Color')" data-type="color" data-default="'#ff3b30'" />
  <meta name="x-icue-property" content="backgroundColor" data-label="tr('Background Color')" data-type="color" data-default="'#000000'" />
  <meta name="x-icue-property" content="backgroundMedia" data-label="tr('Background Image')" data-type="media-selector" data-filters="['*.png','*.jpg','*.jpeg','*.webp']" />
  <meta name="x-icue-property" content="glassBlur" data-label="tr('Glass Blur')" data-type="slider" data-default="0" data-min="0" data-max="30" data-step="1" />
  <meta name="x-icue-property" content="transparency" data-label="tr('Background Transparency')" data-type="slider" data-default="100" data-min="0" data-max="100" data-step="1" data-unit-label="'%'" />

  <script type="application/json" id="x-icue-groups">
  [
    {
      "title": "tr('NFL Scoreboard')",
      "properties": ["refreshLive", "refreshIdle", "showFinished", "showLogos", "teamColors"],
      "info": "tr('Live Refresh sets how often scores update while a game is in progress. Idle Refresh is used when no game is live. Tap a game to open it on ESPN.')"
    },
    {
      "title": "tr('Widget Personalization')",
      "properties": ["textColor", "accentColor", "backgroundColor", "backgroundMedia", "glassBlur", "transparency"]
    }
  ]
  </script>
</head>
<body>
  <style>
    /* MediaViewer (inlined: iCUE blocks external scripts for user widgets) */
    .position-container { position: absolute; transform-origin: top left; }
    .scale-container { transform-origin: top left; }
    .rotation-container { transform-origin: center center; }
    .rotation-container img, .rotation-container video { display: block; object-fit: contain; }

    :root {
      --text-color: #ffffff;
      --accent-color: #ff3b30;
      --bg-color: #000000;
      --bg-opacity: 1;
      --bg-blur: 0px;

      /* Sizing baseline: every component size derives from this one unit. */
      --layout-unit: 1vmin;
      --device-vertical-s-unit: 4.16px; /* 416px / 100 */

      --cols: 2;
      --rows: 8;

      --space-pad-y: calc(var(--layout-unit) * 3.6);
      --space-pad-x: calc(var(--layout-unit) * 5);
      --space-gap: calc(var(--layout-unit) * 1.2);
      --space-col-gap: calc(var(--layout-unit) * 3);
      --space-inner: calc(var(--layout-unit) * 1.6);
      --radius-row: calc(var(--layout-unit) * 1.6);

      --font-score: max(14px, calc(var(--layout-unit) * 5.2));
      --font-team: max(12px, calc(var(--layout-unit) * 4.2));
      --font-status: max(11px, calc(var(--layout-unit) * 3.5));
      --font-sub: max(11px, calc(var(--layout-unit) * 2.8));
      --font-label: max(11px, calc(var(--layout-unit) * 3.2));
      --font-state-title: calc(var(--layout-unit) * 7);
      --font-state-body: max(12px, calc(var(--layout-unit) * 3.8));

      --logo-size: calc(var(--layout-unit) * 6.4);
      --stripe-width: max(3px, calc(var(--layout-unit) * 0.9));
      --dot-size: max(5px, calc(var(--layout-unit) * 1.4));
      --header-height: calc(var(--layout-unit) * 7);
    }

    /* Vertical Xeneon Edge slots keep Small-vertical proportions (canonical baseline). */
    @media (min-width: 680px) and (max-width: 712px) and (min-height: 416px) {
      :root { --layout-unit: var(--device-vertical-s-unit); }
    }

    /* Wider slots (not a target size, but keep them usable): more columns. */
    @media (min-width: 1400px) { :root { --cols: 3; } }
    @media (min-width: 2200px) { :root { --cols: 4; } }

    html { overflow: hidden; }
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      font-family: OpenSans, "Segoe UI", Arial, sans-serif;
      background: transparent;
      -webkit-user-select: none;
      user-select: none;
    }

    .widget-root {
      position: relative;
      width: 100%;
      height: 100%;
      color: var(--text-color);
      overflow: hidden;
    }

    .widget-background {
      position: absolute;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      opacity: var(--bg-opacity);
      transition: opacity 0.2s ease;
    }
    .main-glass {
      position: absolute;
      inset: 0;
      background-color: var(--bg-color);
    }
    #media-background {
      width: 100%;
      height: 100%;
      position: relative;
      filter: blur(var(--bg-blur));
    }

    .main-content {
      position: relative;
      z-index: 2;
      height: 100%;
      padding: var(--space-pad-y) var(--space-pad-x);
      display: flex;
      flex-direction: column;
      gap: var(--space-gap);
    }

    /* Header strip */
    .topbar {
      flex: 0 0 var(--header-height);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: var(--font-label);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .topbar-title { font-weight: 700; }
    .topbar-title .week { opacity: 0.6; font-weight: 600; margin-left: 0.6em; }
    .topbar-meta { display: flex; align-items: center; gap: 1.2em; opacity: 0.6; }
    .topbar-meta .live-count { color: var(--accent-color); opacity: 1; font-weight: 700; display: flex; align-items: center; gap: 0.45em; }
    .topbar-meta .live-count::before {
      content: "";
      width: var(--dot-size);
      height: var(--dot-size);
      border-radius: 50%;
      background: var(--accent-color);
    }
    .topbar-meta .offline-tag {
      color: var(--text-color);
      border: 1px solid currentColor;
      border-radius: calc(var(--layout-unit) * 0.8);
      padding: 0.1em 0.5em;
      font-weight: 700;
    }
    .topbar-meta-group { display: flex; align-items: center; gap: 1.2em; }

    /* Game grid: every game visible at once, rows share the height evenly. */
    .games {
      flex: 1 1 0;
      min-height: 0;
      overflow: hidden;
      display: grid;
      grid-template-columns: repeat(var(--cols), minmax(0, 1fr));
      grid-template-rows: repeat(var(--rows), minmax(0, 1fr));
      grid-auto-flow: row;
      column-gap: var(--space-col-gap);
      row-gap: var(--space-gap);
    }

    .game {
      min-height: 0;
      min-width: 0;
      overflow: hidden;
      display: flex;
      align-items: center;
      gap: var(--space-inner);
      padding: 0 var(--space-inner);
      border-radius: var(--radius-row);
      background: rgba(255, 255, 255, 0.06);
      cursor: pointer;
      transition: background-color 0.15s ease, transform 0.1s ease;
    }
    .game:active { background: rgba(255, 255, 255, 0.16); transform: scale(0.985); }
    .game.is-in {
      background: color-mix(in srgb, var(--accent-color) 14%, transparent);
      box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent-color) 55%, transparent);
    }

    .side {
      flex: 1 1 0;
      min-width: 0;
      align-self: stretch;
      display: flex;
      align-items: center;
      gap: var(--space-inner);
    }
    .side.home { flex-direction: row-reverse; }

    .stripe {
      flex: 0 0 var(--stripe-width);
      height: 62%;
      border-radius: var(--stripe-width);
      background: var(--team-color, transparent);
    }
    .no-team-colors .stripe { display: none; }

    .logo {
      flex: 0 0 auto;
      height: min(var(--logo-size), 80%);
      width: auto;
      aspect-ratio: 1 / 1;
      object-fit: contain;
    }
    .no-logos .logo { display: none; }

    .abbr {
      font-size: var(--font-team);
      font-weight: 700;
      letter-spacing: 0.02em;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 0.3em;
    }
    .poss {
      width: var(--dot-size);
      height: var(--dot-size);
      border-radius: 50%;
      background: var(--text-color);
      opacity: 0.85;
      visibility: hidden;
    }
    .poss.has-ball { visibility: visible; }
    .poss.red-zone { background: var(--accent-color); opacity: 1; }

    .score {
      margin-left: auto;
      font-size: var(--font-score);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      line-height: 1;
    }
    .side.home .score { margin-left: 0; margin-right: auto; }

    .side.is-loser { opacity: 0.55; }
    .is-pre .score { display: none; }

    .status {
      flex: 0 0 auto;
      min-width: 6.2em;
      padding: 0 0.5em;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      line-height: 1.15;
      text-align: center;
      white-space: nowrap;
      font-size: var(--font-status);
    }
    .status .main { font-weight: 700; font-variant-numeric: tabular-nums; opacity: 0.85; }
    .status .sub { font-size: var(--font-sub); opacity: 0.6; }
    .is-in .status .main { color: var(--accent-color); opacity: 1; }
    .is-post .status .main { opacity: 0.6; }
    .games[data-dense="true"] .status .sub { display: none; }

    /* Full-panel states */
    .panel-state {
      flex: 1 1 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: calc(var(--layout-unit) * 2);
      padding: 0 calc(var(--layout-unit) * 8);
    }
    .panel-state .title { font-size: var(--font-state-title); font-weight: 700; }
    .panel-state .body { font-size: var(--font-state-body); opacity: 0.7; max-width: 46em; line-height: 1.35; }
    .spinner {
      width: calc(var(--layout-unit) * 7);
      height: calc(var(--layout-unit) * 7);
      border-radius: 50%;
      border: calc(var(--layout-unit) * 0.8) solid rgba(255, 255, 255, 0.15);
      border-top-color: var(--accent-color);
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    [hidden] { display: none !important; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>

  <div class="widget-root" id="root">
    <div class="widget-background" aria-hidden="true">
      <div class="main-glass"></div>
      <div id="media-background"></div>
    </div>

    <div class="main-content">
      <div class="topbar" id="topbar" hidden>
        <div class="topbar-title"><span>NFL</span><span class="week" id="week-label"></span></div>
        <div class="topbar-meta">
          <span class="live-count" id="live-count" hidden></span>
          <span class="topbar-meta-group">
            <span class="offline-tag" id="offline-tag" hidden>OFFLINE</span>
            <span id="updated-label"></span>
          </span>
        </div>
      </div>

      <div class="panel-state" id="state-loading" role="status">
        <div class="spinner" aria-hidden="true"></div>
        <div class="body" id="loading-text">Loading scores...</div>
      </div>

      <div class="panel-state" id="state-message" role="status" hidden>
        <div class="title" id="message-title"></div>
        <div class="body" id="message-body"></div>
      </div>

      <div class="games" id="games" role="list" hidden></div>
    </div>
  </div>

  <script>
    class MediaViewer {
      constructor(options = {}) {
        this.container = options.container;
        this.onMediaLoaded = options.onMediaLoaded || (() => {});
        this.onMediaError = options.onMediaError || (() => {});
        this.debug = options.debug || false;
        this.positionContainer = null; this.scaleContainer = null; this.rotationContainer = null;
        this.mediaElement = null; this.currentMediaPath = null;
        this.supportedImageFormats = ["jpg","jpeg","png","gif","bmp","webp","svg","ico"];
        this.supportedVideoFormats = ["mp4","webm","ogg","mov","avi","mkv"];
        if (!this.container) throw new Error("MediaViewer: container is required");
      }
      getFileExtension(p) { return p.split(".").pop().toLowerCase(); }
      isImageFile(e) { return this.supportedImageFormats.includes(e); }
      isVideoFile(e) { return this.supportedVideoFormats.includes(e); }
      log(...a) { if (this.debug) console.log("[MediaViewer]", ...a); }
      warn(...a) { if (this.debug) console.warn("[MediaViewer]", ...a); }
      error(...a) { console.error("[MediaViewer]", ...a); }
      createImageElement(filePath) {
        const img = document.createElement("img");
        img.src = filePath;
        img.onerror = () => { this.error("Failed to load image:", filePath); this.onMediaError(new Error("Failed to load image: " + filePath)); };
        img.onload  = () => { this.log("Image loaded:", filePath); this.onMediaLoaded(img); };
        return img;
      }
      createVideoElement(filePath) {
        const video = document.createElement("video");
        video.controls = false; video.autoplay = true; video.loop = true; video.muted = true; video.playsInline = true;
        video.addEventListener("loadeddata", () => {
          video.play().then(() => { this.onMediaLoaded(video); }).catch(e => { this.error("Error playing video:", e); this.onMediaError(e); });
        });
        video.addEventListener("error", e => { this.error("Video error:", e); this.onMediaError(new Error("Video error: " + (video.error?.message || "Unknown"))); });
        video.src = filePath;
        return video;
      }
      createMediaElement(filePath) {
        const ext = this.getFileExtension(filePath);
        if (this.isImageFile(ext)) return this.createImageElement(filePath);
        if (this.isVideoFile(ext)) return this.createVideoElement(filePath);
        this.error("Unsupported format:", ext); this.onMediaError(new Error("Unsupported format: " + ext)); return null;
      }
      createContainers() {
        this.positionContainer = document.createElement("div"); this.positionContainer.className = "position-container";
        this.scaleContainer    = document.createElement("div"); this.scaleContainer.className    = "scale-container";
        this.rotationContainer = document.createElement("div"); this.rotationContainer.className = "rotation-container";
        this.rotationContainer.appendChild(this.mediaElement);
        this.scaleContainer.appendChild(this.rotationContainer);
        this.positionContainer.appendChild(this.scaleContainer);
        return this.positionContainer;
      }
      applyTransform(params = {}) {
        if (!this.positionContainer) return;
        const baseWidth = params.baseWidth || 100; const baseHeight = params.baseHeight || 100;
        const scaleValue = params.scale !== undefined ? params.scale : 1;
        const posX = params.positionX || 0; const posY = params.positionY || 0; const rotation = params.angle || 0;
        const minScale = Math.min(this.container.clientWidth / baseWidth, this.container.clientHeight / baseHeight);
        this.positionContainer.style.transform = `translate(${posX * minScale}px, ${posY * minScale}px)`;
        this.scaleContainer.style.transform    = `scale(${scaleValue * minScale})`;
        this.rotationContainer.style.transform = `rotate(${rotation}deg)`;
      }
      loadMedia(params = {}) {
        const filePath = params.path; if (!filePath) { this.clear(); return; }
        const decoded = decodeURIComponent(filePath);
        if (this.currentMediaPath === decoded) { this.applyTransform(params); return; }
        this.clear();
        this.mediaElement = this.createMediaElement(decoded); if (!this.mediaElement) return;
        this.container.appendChild(this.createContainers());
        this.container.style.visibility = "visible";
        this.applyTransform(params); this.currentMediaPath = decoded;
      }
      clear() {
        this.container.innerHTML = ""; this.container.style.visibility = "hidden";
        this.positionContainer = this.scaleContainer = this.rotationContainer = this.mediaElement = this.currentMediaPath = null;
      }
      destroy() { this.clear(); this.container = this.onMediaLoaded = this.onMediaError = null; }
    }
  </script>

  <script>
    // iCUE API binding: bare assignment is intentional (see lifecycle notes).
    icueEvents = {
      'onDataUpdated': onIcueDataUpdated,
      'onICUEInitialized': onIcueInitialized
    };
    pluginLinkproviderEvents = {
      'onInitialized': function () {}
    };

    // ---- Constants ----------------------------------------------------------
    const SCOREBOARD_URL = 'https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard';
    const LOGO_ORIGIN = 'https://a.espncdn.com/';
    const GAME_LINK_ORIGIN = 'https://www.espn.com/';
    const FETCH_TIMEOUT_MS = 15000;
    const STORAGE_FALLBACK_KEY = 'gg.alexav.nflscoreboard';
    const CACHE_FIELD = 'nflScoreboardCache';

    // UI strings. Replaced with translations from translation.json when tr() exists.
    const S = {
      'Loading scores...': 'Loading scores...',
      "Can't reach ESPN": "Can't reach ESPN",
      "Check your connection, or allow site.api.espn.com in this widget's iCUE permissions. Retrying automatically.":
        "Check your connection, or allow site.api.espn.com in this widget's iCUE permissions. Retrying automatically.",
      'No games this week': 'No games this week',
      'ESPN has no NFL games scheduled right now. Scores will appear when the next week is posted.':
        'ESPN has no NFL games scheduled right now. Scores will appear when the next week is posted.',
      'All games are final': 'All games are final',
      "Turn on Show Finished Games to see this week's results.": "Turn on Show Finished Games to see this week's results.",
      'WEEK': 'WEEK', 'PRESEASON': 'PRESEASON', 'PLAYOFFS': 'PLAYOFFS',
      'LIVE': 'LIVE', 'OFFLINE': 'OFFLINE', 'Updated': 'Updated',
      'FINAL': 'FINAL', 'HALF': 'HALF', 'END': 'END', 'OT': 'OT',
      'PPD': 'PPD', 'CANC': 'CANC', 'DELAY': 'DELAY'
    };

    // ---- iCUE property helpers ------------------------------------------------
    function getIcueProperty(name) {
      if (typeof window !== 'undefined' && Object.prototype.hasOwnProperty.call(window, name)) {
        const value = window[name];
        if (value !== undefined && value !== null && value !== '') return value;
      }
      try {
        const value = Function('return typeof ' + name + ' !== "undefined" ? ' + name + ' : undefined')();
        if (value !== undefined && value !== null && value !== '') return value;
      } catch (e) {}
      return undefined;
    }

    function clampRange(v, min, max, d) {
      v = Number(v);
      if (!Number.isFinite(v)) return d;
      return Math.max(min, Math.min(max, v));
    }

    function boolProp(name, d) {
      const v = getIcueProperty(name);
      if (v === undefined) return d;
      if (typeof v === 'string') return v.toLowerCase() === 'true';
      return Boolean(v);
    }

    function colorProp(name, d) {
      const v = getIcueProperty(name);
      return (typeof v === 'string' && v) ? v : d;
    }

    function settings() {
      return {
        refreshLiveMs: clampRange(getIcueProperty('refreshLive'), 15, 120, 30) * 1000,
        refreshIdleMs: clampRange(getIcueProperty('refreshIdle'), 1, 30, 10) * 60000,
        showFinished: boolProp('showFinished', true),
        showLogos: boolProp('showLogos', true),
        teamColors: boolProp('teamColors', true)
      };
    }

    function localeTag() {
      try {
        if (typeof iCUE !== 'undefined' && iCUE.iCUELanguage) return String(iCUE.iCUELanguage).replace('_', '-');
      } catch (e) {}
      return undefined;
    }

    async function loadTranslations() {
      if (typeof tr !== 'function') return;
      await Promise.all(Object.keys(S).map(async function (key) {
        try {
          const value = await tr(key);
          if (typeof value === 'string' && value) S[key] = value;
        } catch (e) {}
      }));
    }

    // ---- Media background -----------------------------------------------------
    function resolveMediaPath(value) {
      if (!value) return '';
      if (typeof value === 'string') return value;
      if (value.pathToAsset) return value.pathToAsset;
      if (value.path) return value.path;
      if (value.value) return value.value;
      return '';
    }

    function normalizeMediaConfig(rawMedia) {
      const mediaPath = resolveMediaPath(rawMedia);
      if (!mediaPath) return null;
      const base = (rawMedia && typeof rawMedia === 'object') ? rawMedia : {};
      return {
        path: base.pathToAsset || mediaPath,
        baseWidth: Number(base.baseWidth) || Number(base.baseSizeX) || 0,
        baseHeight: Number(base.baseHeight) || Number(base.baseSizeY) || 0,
        scale: Number.isFinite(Number(base.scale)) ? Number(base.scale) : 1,
        positionX: Number(base.positionX) || 0,
        positionY: Number(base.positionY) || 0,
        angle: Number(base.angle) || 0
      };
    }

    function createMediaBackgroundComponent(container) {
      if (!container) return { clear: function () {}, loadMedia: function () {} };
      if (typeof MediaViewer === 'function') {
        const viewer = new MediaViewer({
          container: container,
          onMediaLoaded: function () {},
          onMediaError: function (e) { console.error('Media error:', e); }
        });
        return {
          clear: function () { viewer.clear(); },
          loadMedia: function (config) { viewer.loadMedia(config); }
        };
      }
      return {
        clear: function () { container.style.backgroundImage = ''; },
        loadMedia: function (config) {
          const p = (config && config.path) ? config.path : resolveMediaPath(config);
          if (!p) { container.style.backgroundImage = ''; return; }
          container.style.backgroundImage = "url('" + String(p).replace(/\\/g, '\\\\').replace(/'/g, "\\'") + "')";
          container.style.backgroundRepeat = 'no-repeat';
          container.style.backgroundSize = 'cover';
          container.style.backgroundPosition = 'center';
          container.style.visibility = 'visible';
        }
      };
    }

    const mediaBackground = createMediaBackgroundComponent(document.getElementById('media-background'));

    function applyStyles() {
      const root = document.documentElement;
      root.style.setProperty('--bg-opacity', clampRange(getIcueProperty('transparency'), 0, 100, 100) / 100);
      root.style.setProperty('--text-color', colorProp('textColor', '#ffffff'));
      root.style.setProperty('--accent-color', colorProp('accentColor', '#ff3b30'));
      root.style.setProperty('--bg-color', colorProp('backgroundColor', '#000000'));
      root.style.setProperty('--bg-blur', clampRange(getIcueProperty('glassBlur'), 0, 30, 0) + 'px');

      const mediaConfig = normalizeMediaConfig(getIcueProperty('backgroundMedia'));
      if (mediaConfig) mediaBackground.loadMedia(mediaConfig);
      else mediaBackground.clear();

      const s = settings();
      const widgetRoot = document.getElementById('root');
      widgetRoot.classList.toggle('no-logos', !s.showLogos);
      widgetRoot.classList.toggle('no-team-colors', !s.teamColors);
    }

    // ---- Local cache (last known scores, per widget instance) -----------------
    function storageKey() {
      const id = getIcueProperty('uniqueId');
      return id ? String(id) : STORAGE_FALLBACK_KEY;
    }

    function readCache() {
      try {
        const raw = localStorage.getItem(storageKey());
        if (!raw) return null;
        const stored = JSON.parse(raw);
        const cache = stored && stored[CACHE_FIELD];
        return (cache && Array.isArray(cache.games)) ? cache : null;
      } catch (e) {
        return null;
      }
    }

    function writeCache(board) {
      try {
        const key = storageKey();
        let stored = {};
        try { stored = JSON.parse(localStorage.getItem(key) || '{}') || {}; } catch (e) { stored = {}; }
        stored[CACHE_FIELD] = board;
        localStorage.setItem(key, JSON.stringify(stored));
      } catch (e) {}
    }

    // ---- ESPN parsing -------------------------------------------------------
    function safeColor(hex) {
      return (typeof hex === 'string' && /^[0-9a-fA-F]{6}$/.test(hex)) ? '#' + hex : null;
    }

    function luminance(hex) {
      if (!hex) return 0;
      const n = parseInt(hex.slice(1), 16);
      const ch = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(function (c) {
        c /= 255;
        return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
      });
      return 0.2126 * ch[0] + 0.7152 * ch[1] + 0.0722 * ch[2];
    }

    // Pick whichever team color stays visible on a dark background.
    function stripeColor(primary, alternate) {
      if (primary && luminance(primary) >= 0.05) return primary;
      if (alternate && luminance(alternate) >= 0.05) return alternate;
      return primary || alternate || null;
    }

    function safeLogo(url) {
      return (typeof url === 'string' && url.indexOf(LOGO_ORIGIN) === 0) ? url : '';
    }

    function parseTeam(c) {
      const t = (c && c.team) || {};
      const primary = safeColor(t.color);
      const alternate = safeColor(t.alternateColor);
      return {
        id: String(t.id || ''),
        abbr: String(t.abbreviation || '').slice(0, 4),
        name: String(t.displayName || t.shortDisplayName || t.abbreviation || ''),
        score: (c && c.score !== undefined && c.score !== '') ? String(c.score) : '',
        winner: Boolean(c && c.winner),
        color: stripeColor(primary, alternate),
        logo: safeLogo(t.logoDark) || safeLogo(t.logo)
      };
    }

    function gameLink(ev) {
      const links = Array.isArray(ev.links) ? ev.links : [];
      const preferred = ['summary', 'live', 'boxscore'];
      for (let i = 0; i < preferred.length; i++) {
        const match = links.find(function (l) {
          return l && Array.isArray(l.rel) && l.rel.indexOf(preferred[i]) !== -1 && l.rel.indexOf('desktop') !== -1;
        });
        if (match && typeof match.href === 'string' && match.href.indexOf(GAME_LINK_ORIGIN) === 0) return match.href;
      }
      return ev.id ? GAME_LINK_ORIGIN + 'nfl/game/_/gameId/' + encodeURIComponent(ev.id) : '';
    }

    function parseGame(ev) {
      const comp = ev && Array.isArray(ev.competitions) ? ev.competitions[0] : null;
      if (!comp || !Array.isArray(comp.competitors)) return null;
      const awayRaw = comp.competitors.find(function (c) { return c.homeAway === 'away'; }) || comp.competitors[0];
      const homeRaw = comp.competitors.find(function (c) { return c.homeAway === 'home'; }) || comp.competitors[1];
      if (!awayRaw || !homeRaw) return null;
      const status = ev.status || comp.status || {};
      const type = status.type || {};
      const sit = comp.situation || {};
      return {
        id: String(ev.id || ''),
        date: ev.date || '',
        state: type.state === 'in' || type.state === 'post' ? type.state : 'pre',
        statusName: String(type.name || ''),
        shortDetail: String(type.shortDetail || ''),
        period: Number(status.period) || 0,
        clock: String(status.displayClock || ''),
        possession: sit.possession ? String(sit.possession) : '',
        redZone: Boolean(sit.isRedZone),
        downText: String(sit.shortDownDistanceText || ''),
        link: gameLink(ev),
        away: parseTeam(awayRaw),
        home: parseTeam(homeRaw)
      };
    }

    function parseBoard(data) {
      const events = Array.isArray(data && data.events) ? data.events : [];
      const games = events.map(parseGame).filter(Boolean);
      return {
        week: Number(data && data.week && data.week.number) || 0,
        seasonType: Number(data && data.season && data.season.type) || 0,
        games: games,
        fetchedAt: Date.now()
      };
    }

    // ---- Formatting ---------------------------------------------------------
    function ordinalQuarter(period) {
      if (period > 4) return period === 5 ? S['OT'] : (period - 4) + S['OT'];
      return 'Q' + period;
    }

    function kickoffLabel(dateStr) {
      const d = new Date(dateStr);
      if (isNaN(d.getTime())) return '';
      const now = new Date();
      const sameDay = d.toDateString() === now.toDateString();
      const time = d.toLocaleTimeString(localeTag(), { hour: 'numeric', minute: '2-digit' });
      if (sameDay) return time;
      const daysAway = (d - now) / 86400000;
      const day = daysAway > 6
        ? d.toLocaleDateString(localeTag(), { month: 'numeric', day: 'numeric' })
        : d.toLocaleDateString(localeTag(), { weekday: 'short' });
      return day + ' ' + time;
    }

    function statusLabel(g) {
      const name = g.statusName;
      if (name === 'STATUS_POSTPONED') return { main: S['PPD'], sub: '' };
      if (name === 'STATUS_CANCELED') return { main: S['CANC'], sub: '' };
      if (name === 'STATUS_DELAYED' || name === 'STATUS_RAIN_DELAY') return { main: S['DELAY'], sub: '' };
      if (g.state === 'post') {
        const ot = /OT/i.test(g.shortDetail);
        return { main: ot ? S['FINAL'] + '/' + S['OT'] : S['FINAL'], sub: '' };
      }
      if (g.state === 'in') {
        if (name === 'STATUS_HALFTIME') return { main: S['HALF'], sub: '' };
        if (name === 'STATUS_END_PERIOD') return { main: S['END'] + ' ' + ordinalQuarter(g.period), sub: '' };
        const main = g.period ? ordinalQuarter(g.period) + ' ' + g.clock : g.shortDetail;
        return { main: main.trim(), sub: g.downText };
      }
      return { main: kickoffLabel(g.date) || g.shortDetail, sub: '' };
    }

    function weekLabel(board) {
      if (board.seasonType === 1) return S['PRESEASON'] + (board.week ? ' ' + board.week : '');
      if (board.seasonType === 3) return S['PLAYOFFS'];
      return board.week ? S['WEEK'] + ' ' + board.week : '';
    }

    function timeLabel(ms) {
      return new Date(ms).toLocaleTimeString(localeTag(), { hour: 'numeric', minute: '2-digit' });
    }

    // ---- Sorting ------------------------------------------------------------
    const STATE_ORDER = { in: 0, pre: 1, post: 2 };
    function sortGames(games) {
      return games.slice().sort(function (a, b) {
        const s = STATE_ORDER[a.state] - STATE_ORDER[b.state];
        if (s !== 0) return s;
        const ta = new Date(a.date).getTime() || 0;
        const tb = new Date(b.date).getTime() || 0;
        // Finished games: most recent first. Live/upcoming: soonest first.
        return a.state === 'post' ? tb - ta : ta - tb;
      });
    }

    // ---- Rendering ----------------------------------------------------------
    const els = {
      topbar: document.getElementById('topbar'),
      week: document.getElementById('week-label'),
      liveCount: document.getElementById('live-count'),
      offline: document.getElementById('offline-tag'),
      updated: document.getElementById('updated-label'),
      loading: document.getElementById('state-loading'),
      loadingText: document.getElementById('loading-text'),
      message: document.getElementById('state-message'),
      messageTitle: document.getElementById('message-title'),
      messageBody: document.getElementById('message-body'),
      games: document.getElementById('games')
    };

    let board = null;       // last good scoreboard (from network or cache)
    let stale = false;      // true when the last refresh failed
    let hasTried = false;   // at least one network attempt finished

    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function buildSide(team, g, isHome) {
      const side = el('div', 'side ' + (isHome ? 'home' : 'away'));
      if (g.state === 'post' && (g.away.winner || g.home.winner) && !team.winner) side.classList.add('is-loser');

      const stripe = el('span', 'stripe');
      if (team.color) stripe.style.setProperty('--team-color', team.color);
      side.appendChild(stripe);

      if (team.logo) {
        const img = el('img', 'logo');
        img.alt = '';
        img.decoding = 'async';
        img.referrerPolicy = 'no-referrer';
        img.src = team.logo;
        img.onerror = function () { img.remove(); };
        side.appendChild(img);
      }

      const abbr = el('span', 'abbr');
      const poss = el('span', 'poss');
      if (g.state === 'in' && g.possession && g.possession === team.id) {
        poss.classList.add('has-ball');
        if (g.redZone) poss.classList.add('red-zone');
      }
      const label = el('span', '', team.abbr);
      if (isHome) { abbr.appendChild(label); abbr.appendChild(poss); }
      else { abbr.appendChild(poss); abbr.appendChild(label); }
      side.appendChild(abbr);

      side.appendChild(el('span', 'score', team.score));
      return side;
    }

    function buildRow(g) {
      const row = el('div', 'game is-' + g.state);
      row.setAttribute('role', 'listitem');
      const status = statusLabel(g);
      row.setAttribute('aria-label',
        g.away.name + ' ' + (g.state === 'pre' ? '' : g.away.score) + ' at ' +
        g.home.name + ' ' + (g.state === 'pre' ? '' : g.home.score) + ', ' + status.main);

      row.appendChild(buildSide(g.away, g, false));

      const statusEl = el('div', 'status');
      statusEl.appendChild(el('span', 'main', status.main));
      if (status.sub) statusEl.appendChild(el('span', 'sub', status.sub));
      row.appendChild(statusEl);

      row.appendChild(buildSide(g.home, g, true));

      if (g.link) row.addEventListener('click', function () { openLink(g.link); });
      return row;
    }

    function showPanel(which) {
      els.loading.hidden = which !== 'loading';
      els.message.hidden = which !== 'message';
      els.games.hidden = which !== 'games';
    }

    function showMessage(title, body) {
      els.messageTitle.textContent = title;
      els.messageBody.textContent = body;
      showPanel('message');
    }

    function columnCount() {
      const v = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--cols'), 10);
      return v > 0 ? v : 2;
    }

    function layoutGrid() {
      const count = els.games.childElementCount;
      const cols = columnCount();
      // At least 4 rows so a light slate does not produce giant rows.
      const rows = Math.max(4, Math.ceil(count / cols));
      els.games.style.setProperty('--rows', rows);
      els.games.dataset.dense = rows >= 7 ? 'true' : 'false';
    }

    function render() {
      els.loadingText.textContent = S['Loading scores...'];

      if (!board) {
        els.topbar.hidden = true;
        if (hasTried && stale) {
          showMessage(S["Can't reach ESPN"],
            S["Check your connection, or allow site.api.espn.com in this widget's iCUE permissions. Retrying automatically."]);
        } else {
          showPanel('loading');
        }
        return;
      }

      // Header
      els.topbar.hidden = false;
      els.week.textContent = weekLabel(board);
      const liveGames = board.games.filter(function (g) { return g.state === 'in'; }).length;
      els.liveCount.hidden = liveGames === 0;
      els.liveCount.textContent = liveGames + ' ' + S['LIVE'];
      els.offline.hidden = !stale;
      els.offline.textContent = S['OFFLINE'];
      els.updated.textContent = timeLabel(board.fetchedAt);

      // Games
      const s = settings();
      const visible = sortGames(board.games.filter(function (g) { return s.showFinished || g.state !== 'post'; }));

      if (board.games.length === 0) {
        showMessage(S['No games this week'],
          S['ESPN has no NFL games scheduled right now. Scores will appear when the next week is posted.']);
        return;
      }
      if (visible.length === 0) {
        showMessage(S['All games are final'], S["Turn on Show Finished Games to see this week's results."]);
        return;
      }

      const frag = document.createDocumentFragment();
      visible.forEach(function (g) { frag.appendChild(buildRow(g)); });
      els.games.replaceChildren(frag);
      showPanel('games');
      layoutGrid();
    }

    // ---- Links --------------------------------------------------------------
    function openLink(url) {
      if (typeof url !== 'string' || url.indexOf(GAME_LINK_ORIGIN) !== 0) return;
      const linkReady = typeof pluginLinkprovider_initialized !== 'undefined' && pluginLinkprovider_initialized;
      if (window.plugins && window.plugins.Linkprovider && linkReady) {
        window.plugins.Linkprovider.open(url);
      } else if (!insideIcue()) {
        // Browser testing outside iCUE only.
        window.open(url, '_blank', 'noopener');
      }
    }

    function insideIcue() {
      return typeof iCUE_initialized !== 'undefined' && Boolean(iCUE_initialized);
    }

    // ---- Network + scheduling -----------------------------------------------
    let refreshTimer = null;
    let failures = 0;
    let inFlight = false;

    async function fetchScoreboard() {
      const controller = typeof AbortController === 'function' ? new AbortController() : null;
      const timer = controller ? setTimeout(function () { controller.abort(); }, FETCH_TIMEOUT_MS) : null;
      try {
        const response = await fetch(SCOREBOARD_URL, {
          cache: 'no-store',
          credentials: 'omit',
          referrerPolicy: 'no-referrer',
          signal: controller ? controller.signal : undefined
        });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        return parseBoard(await response.json());
      } finally {
        if (timer) clearTimeout(timer);
      }
    }

    async function refresh() {
      if (inFlight) return;
      inFlight = true;
      try {
        board = await fetchScoreboard();
        stale = false;
        failures = 0;
        writeCache(board);
      } catch (err) {
        // Offline, blocked, or permission revoked: indistinguishable here, same handling.
        console.warn('NFL Scoreboard: scores unavailable', err);
        stale = true;
        failures++;
      } finally {
        inFlight = false;
        hasTried = true;
        render();
        scheduleNext();
      }
    }

    function nextDelay() {
      const s = settings();
      if (stale) {
        // Back off on failures: live interval, doubling, capped at the idle interval.
        return Math.min(s.refreshLiveMs * Math.pow(2, Math.max(0, failures - 1)), s.refreshIdleMs);
      }
      const games = board ? board.games : [];
      if (games.some(function (g) { return g.state === 'in'; })) return s.refreshLiveMs;

      // Wake up shortly after the next kickoff so live scores start promptly.
      const now = Date.now();
      let delay = s.refreshIdleMs;
      games.forEach(function (g) {
        if (g.state !== 'pre') return;
        const t = new Date(g.date).getTime();
        if (!t) return;
        const untilKick = t - now + 30000;
        if (untilKick > 0 && untilKick < delay) delay = untilKick;
        // Kickoff time has passed but ESPN still says "pre": poll at the live rate.
        if (untilKick <= 0 && now - t < 3 * 3600000) delay = Math.min(delay, s.refreshLiveMs);
      });
      return Math.max(15000, delay);
    }

    function scheduleNext() {
      if (refreshTimer) clearTimeout(refreshTimer);
      refreshTimer = setTimeout(refresh, nextDelay());
    }

    // ---- Lifecycle ----------------------------------------------------------
    let started = false;
    let resizeObserver = null;

    function start() {
      if (started) return;
      started = true;
      board = readCache();  // last known scores, shown until the first fetch returns
      render();
      refresh();
      if (typeof ResizeObserver === 'function') {
        resizeObserver = new ResizeObserver(function () { if (!els.games.hidden) layoutGrid(); });
        resizeObserver.observe(document.documentElement);
      }
      // Kickoff labels ("Sun 1:00 PM" vs "1:00 PM") depend on today's date.
      setInterval(function () { if (board) render(); }, 5 * 60000);
    }

    function onIcueDataUpdated() {
      applyStyles();
      if (!started) return;
      render();
      scheduleNext();  // refresh interval settings may have changed
    }

    let initialized = false;
    function onIcueInitialized() {
      if (initialized) return;
      initialized = true;
      applyStyles();
      loadTranslations().then(function () { if (started) render(); });
      start();
    }

    var bootAttempts = 0, BOOT_RETRY_MS = 100, BOOT_RETRY_MAX = 15; // ~1.5s grace window
    function bootCheck() {
      if (insideIcue()) { onIcueInitialized(); return; }
      if (bootAttempts < BOOT_RETRY_MAX) { bootAttempts++; setTimeout(bootCheck, BOOT_RETRY_MS); return; }
      // Plain browser (development): run with defaults.
      applyStyles();
      start();
    }
    bootCheck();
  </script>
</body>
</html>
